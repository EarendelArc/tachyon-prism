[package]
name = "tachyon-prism"
version = "0.1.0"
description = "Tachyon Prism desktop client"
authors = ["Tachyon Contributors"]
edition = "2021"

[lib]
name = "tachyon_prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
system-keyring-live-test = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12.3"
ureq = { version = "3.3.0", features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
base64 = "0.23.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
keyring = "4.1.5"
rand = "0.10.2"
zeroize = { version = "1.9.0", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"
rcgen = "0.14.8"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
rustix = { version = "1.1.4", features = ["fs"] }
