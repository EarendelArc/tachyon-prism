name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-contract:
    name: Release contract (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Validate release workflows
        run: |
          python scripts/validate_release.py --check-workflows
          python scripts/verify_production_bundle.py --self-test
          python scripts/prepare_release_assets.py --self-test
          python -m unittest discover -s scripts -p "test_*.py"

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Frontend Tests
        run: npm test

      - name: Web Build
        run: npm run web:build

      - name: Verify production vault boundary
        run: python scripts/verify_production_bundle.py --dist dist

  xray-contract:
    name: Xray contract (linux-x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      XRAY_VERSION: v26.3.27
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install pinned Xray contract binary
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/Xray-linux-64.zip"
          digest_file="${archive}.dgst"
          install_dir="${RUNNER_TEMP}/tachyon-xray-contract"
          release_url="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "${archive}" "${release_url}/Xray-linux-64.zip"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --output "${digest_file}" "${release_url}/Xray-linux-64.zip.dgst"
          digest="$(sed -n 's/^SHA2-256= //p' "${digest_file}")"
          test "${#digest}" -eq 64
          printf '%s  %s\n' "${digest}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          chmod +x "${install_dir}/xray"
          "${install_dir}/xray" version
          echo "TACHYON_XRAY_BINARY_PATH=${install_dir}/xray" >> "${GITHUB_ENV}"

      - name: Validate managed and isolated configs with real Xray
        timeout-minutes: 5
        run: npm run test:xray-contract

  ui-evidence:
    name: Immutable UI evidence
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install application dependencies
        run: npm ci

      - name: Install UI evidence dependencies
        run: python -m pip install --disable-pip-version-check pillow websocket-client

      - name: Build evidence subject executable
        run: npm run build -- --no-bundle

      - name: Stress CDP startup lifecycle
        timeout-minutes: 15
        run: npm run test:ui:stress

      - name: Generate two-run UI evidence
        timeout-minutes: 20
        run: npm run test:ui:twice

      - name: Upload content-addressed UI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tachyon-prism-ui-evidence-${{ github.sha }}
          path: artifacts/ui-smoke-runs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native-e2e:
    name: Native Xray E2E (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      XRAY_VERSION: v26.3.27
      XRAY_WINDOWS_SHA256: d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install application and E2E dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pillow websocket-client

      - name: Install pinned and checksummed Xray
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "Xray-windows-64.zip"
          $digestFile = "$archive.dgst"
          $installDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/xray-live-cache/$env:XRAY_VERSION/extracted"
          $releaseUrl = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION"
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 --output $archive "$releaseUrl/Xray-windows-64.zip"
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output $digestFile "$releaseUrl/Xray-windows-64.zip.dgst"
          $digestLine = Get-Content -LiteralPath $digestFile | Where-Object { $_ -match '^SHA2-256= [0-9a-fA-F]{64}$' } | Select-Object -First 1
          if (-not $digestLine) { throw "official Xray SHA2-256 digest missing" }
          $expected = ($digestLine -split '= ', 2)[1].ToLowerInvariant()
          $pinned = $env:XRAY_WINDOWS_SHA256.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $pinned) { throw "official Xray checksum differs from pinned CI contract" }
          if ($actual -ne $pinned) { throw "Xray checksum mismatch: expected=$pinned actual=$actual" }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $xray = Join-Path $installDir "xray.exe"
          & $xray version
          "TACHYON_XRAY_BINARY_PATH=$xray" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build real Prism release executable
        timeout-minutes: 15
        run: npm run build -- --no-bundle

      - name: Run native subscription-to-dual-proxy E2E
        timeout-minutes: 6
        shell: pwsh
        run: python scripts/prism_tauri_integration_smoke.py --timeout 270 --xray "$env:TACHYON_XRAY_BINARY_PATH"

      - name: Assert native E2E result contract
        if: always()
        shell: pwsh
        run: |
          $resultPath = "artifacts/tauri-integration-smoke/RESULT.json"
          if (-not (Test-Path -LiteralPath $resultPath)) { throw "native E2E RESULT.json missing" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.status -ne "passed") { throw "native E2E did not pass: $($result.failure.message)" }
          if ($result.head -ne $env:GITHUB_SHA) { throw "RESULT head $($result.head) != GITHUB_SHA $env:GITHUB_SHA" }
          $verification = $result.ipc.isolatedNodeVerification
          if ($verification.selectedUpstreamIngress.delta -ne 2) { throw "selected upstream ingress delta != 2" }
          if ($verification.fixtureRequests -ne 2) { throw "fixture delta != 2" }
          if (-not $verification.negativeControl.verificationFailed) { throw "negative control did not fail" }
          if ($verification.negativeControl.fixtureDelta -ne 0) { throw "negative control bypassed selected upstream" }
          if (-not $verification.negativeControl.recovery.generationIdle -or -not $verification.negativeControl.recovery.processStopped -or -not $verification.negativeControl.recovery.portsClosed -or -not $verification.negativeControl.recovery.tempClean -or -not $verification.negativeControl.recovery.systemProxyUnchanged) { throw "failed verification did not fully recover" }
          if (-not $verification.retrySucceeded) { throw "post-failure retry did not succeed" }
          if (-not $verification.successfulRecovery.generationIdle -or -not $verification.successfulRecovery.processStopped -or -not $verification.successfulRecovery.portsClosed -or -not $verification.successfulRecovery.tempClean -or -not $verification.successfulRecovery.systemProxyUnchanged) { throw "successful verification did not fully recover" }
          $safety = $result.diagnostics.networkSafety
          if ($safety.proxyCommandsInvoked -ne $false -or $safety.tunAutoRouteRequested -or $safety.tunDnsHijackRequested) { throw "native E2E attempted system proxy or TUN mutation" }
          if ($safety.systemProxyAudit.status -ne "captured") { throw "native E2E system proxy audit missing" }
          foreach ($snapshotName in @("baseline", "afterNegativeControl", "afterRetrySuccess")) {
            $snapshot = $safety.systemProxyAudit.$snapshotName
            if ($snapshot.captureCount -ne 0 -or $snapshot.restoreCount -ne 0 -or $snapshot.bindCount -ne 0 -or $snapshot.mutationCount -ne 0 -or @($snapshot.events).Count -ne 0) {
              throw "native E2E Rust system proxy audit was nonzero at $snapshotName"
            }
          }
          foreach ($phase in @("negativeControlDelta", "retrySuccessDelta", "totalDelta")) {
            $audit = $safety.systemProxyAudit.$phase
            if ($audit.capture -ne 0 -or $audit.restore -ne 0 -or $audit.bind -ne 0 -or $audit.mutation -ne 0 -or @($audit.events).Count -ne 0) {
              throw "native E2E crossed Rust system proxy boundary during $phase"
            }
          }

      - name: Upload native E2E evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tachyon-prism-native-e2e-${{ github.sha }}
          path: artifacts/tauri-integration-smoke/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  core-contract:
    name: Core contract (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Checkout pinned Tachyon Core contract
        uses: actions/checkout@v6.0.3
        with:
          repository: EarendelArc/tachyon-core
          ref: 80d9fb742c025387c1f036da846fc663ed8a7067
          path: tachyon-core
          fetch-depth: 0

      - name: Verify pinned Core annotated tag and peeled commit
        run: python .github/scripts/verify-core-contract.py tachyon-core

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tachyon-core/go.mod
          cache-dependency-path: tachyon-core/go.sum

      - name: Install
        run: npm ci

      - name: Pinned Core contract
        env:
          TACHYON_CORE_SOURCE_DIR: ${{ github.workspace }}/tachyon-core
        run: npm run test:core-contract

  system-keyring-live:
    name: System keyring (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15
          - platform: linux
            os: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Use crates.io on GitHub Actions
        working-directory: .
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install keyring test dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 15
        run: bash .github/scripts/install-linux-packages.sh dbus-x11 gnome-keyring libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Credential Manager round trip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact

      - name: Keychain round trip in temporary keychain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/tachyon-prism-keyring-live.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          original_default="$(security default-keychain -d user | sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/')"
          original_keychains="${RUNNER_TEMP}/tachyon-prism-original-keychains.txt"
          security list-keychains -d user > "${original_keychains}"
          echo "::add-mask::${keychain_password}"

          cleanup() {
            python3 -c 'import pathlib, shlex, subprocess, sys; subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(pathlib.Path(sys.argv[1]).read_text())], check=True)' "${original_keychains}" || true
            [[ -z "${original_default}" ]] || security default-keychain -d user -s "${original_default}" || true
            security delete-keychain "${keychain_path}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -t 3600 -u "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact

      - name: Secret Service round trip in isolated D-Bus session (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: |
          set -euo pipefail
          export LIVE_KEYRING_HOME="${RUNNER_TEMP}/tachyon-prism-keyring-live-home"
          export LIVE_KEYRING_PASSWORD="$(openssl rand -hex 24)"
          export LIVE_RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          export LIVE_CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          echo "::add-mask::${LIVE_KEYRING_PASSWORD}"
          mkdir -p "${LIVE_KEYRING_HOME}"
          chmod 700 "${LIVE_KEYRING_HOME}"
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="${LIVE_KEYRING_HOME}"
            export RUSTUP_HOME="${LIVE_RUSTUP_HOME}"
            export CARGO_HOME="${LIVE_CARGO_HOME}"
            export PATH="${CARGO_HOME}/bin:${PATH}"
            export XDG_DATA_HOME="${HOME}/.local/share"
            mkdir -p "${XDG_DATA_HOME}/keyrings"
            chmod 700 "${XDG_DATA_HOME}" "${XDG_DATA_HOME}/keyrings"
            eval "$(printf "%s" "${LIVE_KEYRING_PASSWORD}" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact
          '

  rust:
    name: Rust (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_args: "--bundles nsis,msi"
            signing_kind: windows
          - asset_name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundle_args: "--bundles nsis"
            signing_kind: windows
          - asset_name: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
          - asset_name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Use crates.io on GitHub Actions
        working-directory: .
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install application dependencies
        working-directory: .
        run: npm ci

      - name: Test descriptor-safe evidence tooling
        working-directory: .
        run: npm run test:scripts

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 15
        run: bash .github/scripts/install-linux-packages.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --target ${{ matrix.rust_target }}

      - name: Test
        run: cargo test --target ${{ matrix.rust_target }}

      - name: Verify Tauri bundle without publishing
        working-directory: .
        run: npm run build -- --target ${{ matrix.rust_target }} ${{ matrix.bundle_args }}

  required-ci-gate:
    name: Required CI gate
    if: always()
    needs:
      - release-contract
      - typecheck
      - xray-contract
      - ui-evidence
      - native-e2e
      - core-contract
      - system-keyring-live
      - rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI group
        env:
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          XRAY_CONTRACT_RESULT: ${{ needs.xray-contract.result }}
          UI_EVIDENCE_RESULT: ${{ needs.ui-evidence.result }}
          NATIVE_E2E_RESULT: ${{ needs.native-e2e.result }}
          CORE_CONTRACT_RESULT: ${{ needs.core-contract.result }}
          SYSTEM_KEYRING_RESULT: ${{ needs.system-keyring-live.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "release-contract": os.environ["RELEASE_CONTRACT_RESULT"],
              "typecheck": os.environ["TYPECHECK_RESULT"],
              "xray-contract": os.environ["XRAY_CONTRACT_RESULT"],
              "ui-evidence": os.environ["UI_EVIDENCE_RESULT"],
              "native-e2e": os.environ["NATIVE_E2E_RESULT"],
              "core-contract": os.environ["CORE_CONTRACT_RESULT"],
              "system-keyring-live": os.environ["SYSTEM_KEYRING_RESULT"],
              "rust": os.environ["RUST_RESULT"],
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"required CI groups did not succeed: {failed}")
          print("all required CI groups succeeded")
          PY
