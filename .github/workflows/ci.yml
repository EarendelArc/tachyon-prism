name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Validate release workflows
        run: |
          python scripts/validate_release.py --check-workflows
          python scripts/verify_production_bundle.py --self-test
          python -m unittest discover -s scripts -p "test_*.py"

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Frontend Tests
        run: npm test

      - name: Web Build
        run: npm run web:build

      - name: Verify production vault boundary
        run: python scripts/verify_production_bundle.py --dist dist

  ui-evidence:
    name: Immutable UI evidence
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install application dependencies
        run: npm ci

      - name: Install UI evidence dependencies
        run: python -m pip install --disable-pip-version-check pillow websocket-client

      - name: Build evidence subject executable
        run: npm run build -- --no-bundle

      - name: Generate two-run UI evidence
        run: npm run test:ui:twice

      - name: Upload content-addressed UI evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tachyon-prism-ui-evidence-${{ github.sha }}
          path: artifacts/ui-smoke-runs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  core-contract:
    name: Core contract (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Checkout pinned Tachyon Core contract
        uses: actions/checkout@v6.0.3
        with:
          repository: EarendelArc/tachyon-core
          ref: 80d9fb742c025387c1f036da846fc663ed8a7067
          path: tachyon-core
          fetch-depth: 0

      - name: Verify pinned Core annotated tag and peeled commit
        run: python .github/scripts/verify-core-contract.py tachyon-core

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tachyon-core/go.mod
          cache-dependency-path: tachyon-core/go.sum

      - name: Install
        run: npm ci

      - name: Pinned Core contract
        env:
          TACHYON_CORE_SOURCE_DIR: ${{ github.workspace }}/tachyon-core
        run: npm run test:core-contract

  system-keyring-live:
    name: System keyring (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15
          - platform: linux
            os: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Use crates.io on GitHub Actions
        working-directory: .
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install keyring test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Credential Manager round trip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact

      - name: Keychain round trip in temporary keychain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/tachyon-prism-keyring-live.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          original_default="$(security default-keychain -d user | sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/')"
          original_keychains="${RUNNER_TEMP}/tachyon-prism-original-keychains.txt"
          security list-keychains -d user > "${original_keychains}"
          echo "::add-mask::${keychain_password}"

          cleanup() {
            python3 -c 'import pathlib, shlex, subprocess, sys; subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(pathlib.Path(sys.argv[1]).read_text())], check=True)' "${original_keychains}" || true
            [[ -z "${original_default}" ]] || security default-keychain -d user -s "${original_default}" || true
            security delete-keychain "${keychain_path}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -t 3600 -u "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact

      - name: Secret Service round trip in isolated D-Bus session (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TACHYON_PRISM_SYSTEM_KEYRING_LIVE: "1"
        run: |
          set -euo pipefail
          export LIVE_KEYRING_HOME="${RUNNER_TEMP}/tachyon-prism-keyring-live-home"
          export LIVE_KEYRING_PASSWORD="$(openssl rand -hex 24)"
          export LIVE_RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          export LIVE_CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          echo "::add-mask::${LIVE_KEYRING_PASSWORD}"
          mkdir -p "${LIVE_KEYRING_HOME}"
          chmod 700 "${LIVE_KEYRING_HOME}"
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="${LIVE_KEYRING_HOME}"
            export RUSTUP_HOME="${LIVE_RUSTUP_HOME}"
            export CARGO_HOME="${LIVE_CARGO_HOME}"
            export PATH="${CARGO_HOME}/bin:${PATH}"
            export XDG_DATA_HOME="${HOME}/.local/share"
            mkdir -p "${XDG_DATA_HOME}/keyrings"
            chmod 700 "${XDG_DATA_HOME}" "${XDG_DATA_HOME}/keyrings"
            eval "$(printf "%s" "${LIVE_KEYRING_PASSWORD}" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked --features system-keyring-live-test --test system_keyring_live system_keyring_round_trip -- --ignored --exact
          '

  rust:
    name: Rust (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_args: "--bundles nsis,msi"
            signing_kind: windows
          - asset_name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundle_args: "--bundles nsis"
            signing_kind: windows
          - asset_name: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
          - asset_name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Use crates.io on GitHub Actions
        working-directory: .
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install application dependencies
        working-directory: .
        run: npm ci

      - name: Test descriptor-safe evidence tooling
        working-directory: .
        run: npm run test:scripts

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --target ${{ matrix.rust_target }}

      - name: Test
        run: cargo test --target ${{ matrix.rust_target }}

      - name: Verify Tauri bundle without publishing
        working-directory: .
        run: npm run build -- --target ${{ matrix.rust_target }} ${{ matrix.bundle_args }}
