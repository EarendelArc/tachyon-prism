name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Validate release workflows
        run: python scripts/validate_release.py --check-workflows

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Frontend Tests
        run: npm test

      - name: Web Build
        run: npm run web:build

  core-contract:
    name: Core contract (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Checkout pinned Tachyon Core contract
        uses: actions/checkout@v6.0.3
        with:
          repository: EarendelArc/tachyon-core
          ref: 12df9c561a921bed7fc5f63a2ea166e7227d773f
          path: tachyon-core
          fetch-depth: 0

      - name: Verify pinned Core annotated tag and peeled commit
        run: python .github/scripts/verify-core-contract.py tachyon-core

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.4.0"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tachyon-core/go.mod
          cache-dependency-path: tachyon-core/go.sum

      - name: Install
        run: npm ci

      - name: Pinned Core contract
        env:
          TACHYON_CORE_SOURCE_DIR: ${{ github.workspace }}/tachyon-core
        run: npm run test:core-contract

  rust:
    name: Rust (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_args: "--bundles nsis,msi"
            signing_kind: windows
          - asset_name: windows-arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundle_args: "--bundles nsis"
            signing_kind: windows
          - asset_name: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundle_args: "--bundles dmg"
            signing_kind: macos
          - asset_name: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
          - asset_name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundle_args: "--bundles deb"
            signing_kind: none
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Use crates.io on GitHub Actions
        working-directory: .
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --target ${{ matrix.rust_target }}

      - name: Test
        run: cargo test --target ${{ matrix.rust_target }}
